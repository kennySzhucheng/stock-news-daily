<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>无法加载页面</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #F5F7FA; color: #1F2733; padding: 24px;
    font-family: -apple-system, "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; background: #FFFFFF; border-radius: 16px;
    padding: 32px 24px; text-align: center;
    box-shadow: 0 6px 24px rgba(11, 61, 107, .10);
  }
  .badge {
    width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%;
    background: #FDECEC; color: #D64545; font-size: 34px; font-weight: 700;
    line-height: 64px;
  }
  h1 { margin: 0 0 10px; font-size: 19px; color: #0B3D6B; }
  p { margin: 0 0 8px; font-size: 14px; line-height: 1.7; color: #5A6472; }
  .hint { margin-top: 14px; font-size: 12px; color: #939CA9; }
  button {
    margin-top: 24px; width: 100%; height: 48px; border: 0; border-radius: 10px;
    background: #0B7FD4; color: #FFFFFF; font-size: 16px; font-weight: 600;
    cursor: pointer;
  }
  button:active { background: #0968AE; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">!</div>
    <h1>页面加载失败</h1>
    <p>可能是手机当前没有网络，或者站点暂时无法访问。</p>
    <p>请确认已连接 Wi-Fi 或移动数据后重试。</p>
    <button type="button" onclick="doRetry()">重新加载</button>
    <div class="hint">若多次重试仍失败，可稍后再打开本应用。</div>
  </div>
<script>
  function doRetry() {
    try {
      if (window.AndroidBridge && typeof AndroidBridge.retry === 'function') {
        AndroidBridge.retry();
        return;
      }
    } catch (e) { /* 忽略，走下面的兜底 */ }
    location.href = 'https://kennyszhucheng.github.io/stock-news-daily/';
  }
</script>
</body>
</html>
