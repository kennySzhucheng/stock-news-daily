name: 送达体检

# 把「静默失败」主动查出来：日报没送达、送达迟了、外部触发器断了、推送没发出去。
#
# 为什么要单独一个 workflow：**daily.yml 自己没法报告「我今天没跑」**，
# 也没法报告「我跑了但微信没收到」。这条链路上的失败几乎全是静默的，而且
# 表象与「只是延迟」一模一样 —— 2026-09-19 建好的 cron-job.org job 因令牌
# 失效每次被拒，潜伏到 09-24 才被发现，那 5 天里日报每天晚到 4~5 小时。
#
# 自己这个 schedule 同样会被延迟数小时，但**对目标日判定无所谓**：体检的目标日按
# 「最近的、盘后时段已经过去的那一天」来定（见 healthcheck.py 的
# PM_SETTLED_HOUR），延迟到凌晨还是准点跑，选中的都是同一天。
#
# ⚠️ 但延迟对**告警时效**有影响（2026-10-04 记）：实测 22:00 的计划每次都落在
# 次日 01:51~04:26（GitHub schedule 会晚 4~6 小时）。更要紧的是：**监控管道自己
# 也是由那条不可靠的 schedule 触发的** —— 万一 schedule 被丢弃，体检会一起静默消失，
# 而"体检没跑"这件事没有任何人会发现。
#   → 建议在 cron-job.org 再加一个 job（配置方式同 README 第八·五节的盘前/盘后），
#     每天 22:00 对 `healthcheck.yml` 发一次 workflow_dispatch，请求体
#     `{"ref":"main"}`（不需要 inputs）。这样触发源与日报那条链路完全独立。
#
# 2026-10-04 扩容：体检从「送达级」扩到「内容级」——原来只回答"送到了没有"，
# 而 09-28/10-04 的推送正文其实是占位串、09-30 盘后闸门已开却 0 条候选入账，
# 这些全都发生在 push_ok=true 的情况下，旧体检每晚输出"一切正常 ✓"。
# 现在另外核对：推送结论是否解析到、M3 是否通过内容契约、新闻/行情条数是否异常、
# 候选闸门已开却 0 条（见 healthcheck.py 的 CONTENT_SINCE 与「内容面」一节）。
#
# 告警走「让 workflow 失败」而不是只发微信：GitHub 会给仓库所有者发失败邮件，
# 这条通道不经过 Server酱 —— 所以「Server酱 额度耗尽导致推送失败」这种情况
# 也报得出来。另附一条微信推送（--notify），非微信故障时更好读。
on:
  schedule:
    - cron: '0 14 * * *'   # 22:00 北京 —— 此时当天的盘后（含延迟兜底那次）都已落定
  workflow_dispatch:
    inputs:
      date:
        description: '要体检的日期 YYYY-MM-DD，留空 = 最近已结束的一天'
        required: false
        default: ''
        type: string
      days:
        description: '往前连看几天，默认 1'
        required: false
        default: '1'
        type: string

permissions:
  actions: read     # 读运行记录与产物（判断「真正出报」还是被去重跳过）
  contents: read    # 检出代码

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 送达体检
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          ARGS="--notify --repo ${{ github.repository }}"
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          fi
          if [ -n "${{ github.event.inputs.days }}" ]; then
            ARGS="$ARGS --days ${{ github.event.inputs.days }}"
          fi
          python modules/m8_e2e/healthcheck.py $ARGS
          # 退出码 1 = 发现问题 → 本 workflow 失败 → GitHub 发失败邮件。
          # 刻意用「失败」而不是「推送」来告警：这条通道不经过 Server酱。
