name: 股市情报日报

# 定时：每天北京时间 08:10（盘前）与 15:40（盘后）
# GitHub Actions cron 使用 UTC，北京时间 = UTC+8
on:
  schedule:
    - cron: '10 0 * * *'   # 08:10 北京 → 盘前
    - cron: '40 7 * * *'   # 15:40 北京 → 盘后
  workflow_dispatch:        # 支持手动触发（M8 联调用）
    inputs:
      slot:
        description: '时段：填 am 或 pm，留空则按触发时间自动判定'
        required: false
        default: ''
        type: string
      force:
        description: '强制重跑：填 true 则跳过「本时段是否已出报」的去重'
        required: false
        default: ''
        type: string
      # 测试/调试触发用：跑完整条流水线但不发微信，免得把 Server酱 配额
      # 和用户的手机一起污染。正式触发（cron-job.org、本机计划任务、
      # GitHub 自己的 schedule）都不带这个字段，推送照常。
      no_push:
        description: '不发微信推送（调试用）：填 true 则跳过 M6'
        required: false
        default: ''
        type: string

# gh-pages 部署需要写权限
permissions:
  contents: write

# 避免两次运行重叠互相覆盖
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # gh-pages 上的历史日报要恢复到 reports/，否则索引页只剩当天一份。
      # 恢复是否成功供下面的去重步骤判断（失败时无从判断有无重复，放行）。
      - name: 恢复历史日报
        id: restore
        run: |
          if git fetch origin gh-pages --depth=1 2>/dev/null; then
            mkdir -p reports
            git archive FETCH_HEAD | tar -x -C reports
            echo "已恢复历史日报: $(ls reports/*.html 2>/dev/null | wc -l) 份"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "首次运行，暂无 gh-pages 分支"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # 盘前/盘后产出不同文件名（YYYY-MM-DD-am/pm.html），两份都保留、互不覆盖。
      # 用 cron 字符串判断最可靠；手动触发时才按北京时间现算。
      #
      # 同时计算「实际开始 vs 计划时点」的延迟分钟数：GitHub 的 schedule 事件会被
      # 延迟投递（2026-09-17 实测延迟 4~5 小时），此时"盘前"标签与内容严重不符
      # （12:46 才跑的任务抓的是当天上午的盘中新闻）。M5/M6 据此在日报与推送里标注。
      - name: 判定运行时段
        id: slot
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          case "$SLOT" in am|pm) ;; *) SLOT="" ;; esac   # 手动输入非法值则转为自动判定
          PLAN=""
          if [ -z "$SLOT" ]; then
            case "${{ github.event.schedule }}" in
              "10 0 * * *") SLOT=am; PLAN="08:10" ;;   # 08:10 北京 = 00:10 UTC
              "40 7 * * *") SLOT=pm; PLAN="15:40" ;;   # 15:40 北京 = 07:40 UTC
              *) H=$(TZ=Asia/Shanghai date +%H)
                 if [ "$H" -lt 12 ]; then SLOT=am; else SLOT=pm; fi ;;
            esac
          fi
          # 时段定了，计划时点也就定了，与「怎么被触发的」无关——手动触发盘前
          # 同样计划在 08:10。此前 PLAN 只在「由 schedule 反推时段」那条分支里
          # 赋值，于是 cron-job.org / 本机任务走的 workflow_dispatch 下 plan 恒为空，
          # 下面的去重步骤拿不到计划时点，就无法判断已存在的产出是不是测试跑的
          # （2026-09-25 凌晨一次测试 dispatch 占掉当天盘前名额，08:10 准点触发
          # 被判重复而跳过，见 M8 条目）。
          #
          # DELAY 仍只对 schedule 计算（下面的 if 没动），故 M5/M6 的延迟标注
          # 不受影响：delay_context 要求 plan 与 delay **同时**非空才会标注。
          if [ -z "$PLAN" ]; then
            case "$SLOT" in am) PLAN="08:10" ;; pm) PLAN="15:40" ;; esac
          fi
          # 只有 schedule 触发且已知计划时点时才存在"延迟"；手动触发无从谈起
          DELAY=""
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$PLAN" ]; then
            NOW_E=$(TZ=Asia/Shanghai date +%s)
            PLAN_E=$(TZ=Asia/Shanghai date -d "$(TZ=Asia/Shanghai date +%F) $PLAN" +%s)
            DELAY=$(( (NOW_E - PLAN_E) / 60 ))
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          echo "delay=$DELAY" >> "$GITHUB_OUTPUT"
          echo "本次运行时段: $SLOT（$([ "$SLOT" = am ] && echo 盘前 || echo 盘后)）"
          echo "计划时点: $PLAN　延迟: ${DELAY:-不适用（非 schedule 触发）} 分钟"

      # 两个触发源都可能产出同一时段的报告：外部调度（本机计划任务 / cron-job.org）
      # 按点触发 workflow_dispatch，云端 cron 又可能延迟数小时后在同日再触发一次。
      # 撞车会把同一时段跑两遍：日报被覆盖、微信重复推送、API 白跑一遍。
      #
      # **两种触发都要拦。** 9-19 就是反例：早上 08:10 笔记本在睡眠，本机任务被
      # StartWhenAvailable 顺延到 12:33，而延迟的 cron 12:31 先跑完了并推了带延迟
      # 标注的日报；12:33 的任务因为当时只拦 schedule，又整条重跑一遍 ——
      # 用户收到两条盘前推送，后一条还把带标注的那份覆盖了。
      #
      # 判定用 gh-pages 上的产出文件（上一步已解到 reports/），而不是「最近 N 小时
      # 是否跑过」——后者不分时段：9-17 盘前 cron 延迟到 12:46 才跑，15:40 的外部
      # 触发一查「近 6 小时跑过」就把盘后那次 skip 掉了。文件判定精确到「日期 + 时段」。
      #
      # 触发源因故障补跑时，前一次运行可能仍在进行（并发组会把它排到队列里），
      # 等它真正开始跑时 gh-pages 上已有产出，故不会误判。
      # 确实想覆盖重出时，用 inputs.force=true（本机脚本的 --force）。
      #
      # **「有文件」不等于「该时段已经出过报」—— 还得看它是几点产出的。**
      # 2026-09-25：一次凌晨 00:06 的测试 dispatch 产出了 00:15 的
      # `2026-09-25-am.html`（内容是前一晚的新闻，标题却写「盘前」），08:10 准点
      # 触发一查「文件已存在」就整条跳过，用户既没收到推送、当天读到的也是错误
      # 时点的快照，而所有检查都显示「一切正常」。
      #
      # 故增加时间判据：**产出早于「计划时点 − 30 分钟」的，视为测试/调试运行，
      # 不占用本时段，放行本次正式触发**（阈值见下面 EARLY_TOL_MIN）。判据是
      # 单向的——只放行「过早」的，「迟到」的一律照旧拦住，否则 GitHub cron 那个
      # 延迟 4~5 小时的兜底（电脑关机时唯一的保底）会被自己挡死。
      #
      # 时间取 `git archive | tar -x` 解出来的文件 mtime。注意它**不是**该文件
      # 首次被写入的时刻，而是 gh-pages **tip 提交**的时刻（git archive 对整棵树
      # 统一盖提交日期）。这在本判据下**只会保守、不会误判**：tip 时刻恒 ≥ 该文件
      # 真正被写入的时刻，所以「mtime 判为过早」时真相比它更早；而 tip 要么就是
      # 产出该文件的那次部署（00:15 → 判为过早，放行 ✓），要么是更晚的部署
      # （08:15 → 判为已正点出报，拦住 ✓），计划时点前那半小时内没有部署。
      - name: 检查本时段是否已出报
        id: dup
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.force != 'true'
        run: |
          SLOT="${{ steps.slot.outputs.slot }}"
          PLAN="${{ steps.slot.outputs.plan }}"
          TODAY=$(TZ=Asia/Shanghai date +%F)
          TARGET="reports/${TODAY}-${SLOT}.html"
          # 提前多久以上算「不是正式产出」。正式触发源（GitHub schedule /
          # cron-job.org / 本机任务）都卡在计划时点前后数秒，不可能提前半小时，
          # 所以提前超过 30 分钟的产出只可能是测试/调试。
          # 余量取得很紧是**有意的**：宁可对一次「恰好提前 40 分钟的正式产出」
          # 放行重跑（顶多多一条推送），也不能让一份错误时点的日报占住整天。
          # 漏网的还有 healthcheck 兜底——它的容差只有 15 分钟，会照样告警。
          EARLY_TOL_MIN=30
          # 历史日报没恢复成功（首次运行，或 fetch 瞬断）时无从判断，放行——
          # 宁可重复一次，也不能让去重检查挡住出报
          if [ "${{ steps.restore.outputs.ok }}" != "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "历史日报未恢复，无从判断是否重复，照常执行"
          elif [ ! -f "$TARGET" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "今日 ${SLOT} 报告尚未生成，执行本次"
          elif [ -z "$PLAN" ]; then
            # 没有计划时点就无从判断早晚，退回旧逻辑（保守：拦住）
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "今日 ${SLOT} 报告已存在（$TARGET），跳过本次以避免重复推送"
          else
            PLAN_E=$(TZ=Asia/Shanghai date -d "$(TZ=Asia/Shanghai date +%F) $PLAN" +%s)
            FILE_E=$(stat -c %Y "$TARGET")
            LEAD_MIN=$(( (PLAN_E - FILE_E) / 60 ))
            if [ "$LEAD_MIN" -gt "$EARLY_TOL_MIN" ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "已存在的 $TARGET 产出于计划 ${PLAN} 前 ${LEAD_MIN} 分钟"
              echo "判定为测试/调试运行，不占用本时段，照常执行正式触发"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "今日 ${SLOT} 报告已存在（$TARGET，计划 ${PLAN} 前 ${LEAD_MIN} 分钟产出），跳过本次以避免重复推送"
            fi
          fi

      - name: M1 新闻收集
        if: steps.dup.outputs.skip != 'true'
        run: python modules/m1_collector/collector.py

      # 海外服务器抓国内源可能被地域限制，这一步结果用于 M7 验收第 5 条
      - name: M1 数据源可用性检查
        if: always() && steps.dup.outputs.skip != 'true'
        run: |
          python -c "
          import json, pathlib
          p = pathlib.Path('data/raw_news.json')
          if not p.exists():
              print('raw_news.json 不存在，M1 未产出')
              raise SystemExit(0)
          d = json.loads(p.read_text(encoding='utf-8'))
          ok = fail = 0
          for s in d.get('sources_status', []):
              if 'source' not in s:
                  continue
              if s.get('ok'):
                  ok += 1
                  print(f\"  [OK]   {s['source']}: {s.get('count', 0)} 条\")
              else:
                  fail += 1
                  print(f\"  [FAIL] {s['source']}: {s.get('error', 'unknown')}\")
          print(f'源可用性: {ok} 成功 / {fail} 失败')
          "

      - name: M2 新闻筛选（GLM-4-Flash）
        if: steps.dup.outputs.skip != 'true'
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python modules/m2_filter/filter.py

      - name: M3 深度分析（DeepSeek）
        if: steps.dup.outputs.skip != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python modules/m3_analyzer/analyzer.py

      - name: M4 行情数据
        if: steps.dup.outputs.skip != 'true'
        run: python modules/m4_quotes/quotes.py

      # 必须排在 M5 之前：M5 日报、M6 推送、M9 网页版都要显示「今日候选」，
      # 而候选是这一步写进 reports/picks/ledger.jsonl 的。排在 M5 之后会让
      # 推送里提到的候选在日报里扑空。
      # 账本随 gh-pages 自动跨天留存（部署 publish_dir=./reports，开头 tar 还原
      # 整棵树），无需 git commit、无需 artifact、无需改 .gitignore。
      # 可选产出：它挂了只是少一个版块，不该掐断主链路。
      - name: M10 候选清单与复盘（DeepSeek）
        if: steps.dup.outputs.skip != 'true'
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPORT_SLOT: ${{ steps.slot.outputs.slot }}
        run: python modules/m10_picks/picks.py

      - name: M5 生成日报
        if: steps.dup.outputs.skip != 'true'
        env:
          REPORT_SLOT: ${{ steps.slot.outputs.slot }}
          REPORT_PLAN_TIME: ${{ steps.slot.outputs.plan }}
          REPORT_DELAY_MIN: ${{ steps.slot.outputs.delay }}
        run: python modules/m5_report/report.py

      # M6 失败不影响日报本身（脚本内部已处理，这里再加 always 兜底）。
      #
      # `no_push` 是调试触发的闸门：跑完整条流水线、日报照常上线，只是不占
      # Server酱 的每日 5 条配额、也不往用户手机上推测试内容。正式触发源
      # （cron-job.org / 本机计划任务 / GitHub schedule）都不传这个字段，
      # `'' != 'true'` 成立，推送照常。
      - name: M6 微信推送
        if: always() && steps.dup.outputs.skip != 'true' && github.event.inputs.no_push != 'true'
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          REPORT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          REPORT_SLOT: ${{ steps.slot.outputs.slot }}
          REPORT_PLAN_TIME: ${{ steps.slot.outputs.plan }}
          REPORT_DELAY_MIN: ${{ steps.slot.outputs.delay }}
        run: python modules/m6_push/push.py

      # 网页版是附加产出，放在推送之后并允许失败：
      # 它出问题不该掐断主链路（微信推送、Pages 部署）。
      # 线上地址 https://<owner>.github.io/<repo>/web/
      - name: M9 导出网页版
        if: steps.dup.outputs.skip != 'true'
        continue-on-error: true
        run: python modules/m9_web/export.py

      - name: 部署到 GitHub Pages
        if: steps.dup.outputs.skip != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          commit_message: "日报更新 ${{ github.run_number }} [${{ github.event.schedule || 'manual' }}]"

      # 产物名带上时段：运行对象里既没有 inputs 也没有 schedule 字段，
      # 外部工具（modules/m8_e2e/observe.py）光凭触发时刻推不出本次该出哪个时段
      # —— 延迟的盘前 cron 要到 12:4x 才跑，按「是否过 12:00」判会算成盘后。
      # 去重跳过的运行不会走到这一步（上面 if 已拦），故「有没有产物」同时
      # 也是「本次有没有真的产出」的判据。
      - name: 上传产物（便于排查）
        if: always() && steps.dup.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-data-${{ github.run_number }}-${{ steps.slot.outputs.slot }}
          path: |
            data/
            reports/
          retention-days: 7
          if-no-files-found: warn
